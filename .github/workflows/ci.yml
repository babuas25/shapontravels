name: CI and VPS deployment
on:
  push:
    branches: [main, development, production]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Never cancel a running migration.
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Rust and PostgreSQL checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shapontravels_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d shapontravels_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Disposable database integration tests
        run: cargo test --locked --test database -- --ignored
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/shapontravels_test
      - name: Deployment script checks
        run: |
          bash -n scripts/deploy/activate.sh
          bash -n scripts/deploy/send.sh
          bash -n scripts/deploy/backup.sh
          python3 scripts/deploy/test_activate.py
          python3 scripts/deploy/test_send.py
      - name: B2B onboarding and registration mail integration
        run: |
          createdb -T template0 -E UTF8 onboarding_identity_test
          cargo test --locked --test identity_onboarding_flow -- --ignored
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: test
          PGPASSWORD: test
          IDENTITY_ONBOARDING_TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/onboarding_identity_test
      - name: Native business notification integration
        run: |
          createdb business_notification_test
          cargo test --locked --test business_notifications -- --ignored
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: test
          PGPASSWORD: test
          BUSINESS_NOTIFICATION_TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/business_notification_test
  build:
    name: Build Ubuntu 24.04 release
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo build --release --locked --bin shapontravels-api
      - name: Package binary with checksum
        run: |
          mkdir -p dist
          cp target/release/shapontravels-api dist/
          cd dist
          sha256sum shapontravels-api > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: shapontravels-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy-development:
    name: Deploy development
    needs: build
    if: >-
      github.ref == 'refs/heads/development' &&
      github.event_name != 'pull_request' &&
      vars.DEVELOPMENT_DEPLOY_ENABLED == 'true'
    environment: development
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 (Node.js 24)
        with:
          name: shapontravels-${{ github.sha }}
          path: dist
      - name: Upload and activate tested development release
        env:
          VPS_HOST: ${{ vars.DEVELOPMENT_VPS_HOST }}
          VPS_PORT: ${{ vars.DEVELOPMENT_VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.DEVELOPMENT_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.DEVELOPMENT_VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/deploy/send.sh
  deploy-production:
    name: Deploy production
    needs: build
    if: >-
      github.ref == 'refs/heads/production' &&
      github.event_name != 'pull_request' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 (Node.js 24)
        with:
          name: shapontravels-${{ github.sha }}
          path: dist
      - name: Upload and activate tested release
        env:
          VPS_HOST: ${{ vars.PRODUCTION_VPS_HOST }}
          VPS_PORT: ${{ vars.PRODUCTION_VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.PRODUCTION_VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/deploy/send.sh
